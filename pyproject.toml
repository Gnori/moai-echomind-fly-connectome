[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moai-echomind-fly-connectome"
version = "0.0.1"
description = "초파리 커넥톰(MaleCNS v1.0) LIF 시뮬레이터 → MCP 도구 서버 → Qwen 닫힌 고리 (R-3340)"
readme = "README.md"
# moai-echomind 형제 저장소 규약과 같다 — 조용히 3.12 로 내려가지 않게 여기 적는다.
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.2",
    "pyarrow>=19",
    "pyyaml>=6.0",
    "torch>=2.14,<2.15",
    "mcp>=1.27",
    "httpx>=0.28",
]

[project.optional-dependencies]
# 몸(FlyGym 1.x)은 파이썬 3.12 전용이라 body/ 하위 프로젝트로 따로 둔다(R-3340 1.3-8).
# Qwen3.8-27B 가중치를 우리 프로세스에서 직접 읽는다(서버 없음 · R-3340 1.3-7).
llm = ["mlx>=0.32", "mlx-lm>=0.31"]
# 눈으로 보는 3D 세계(R-1177) — 렌더러 통로(WebSocket). 정적 서버는 표준 라이브러리 · 크롬 원격 조종은 쓰지 않는다.
eyeworld = ["websockets>=13"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    # Shiu 모델의 원래 구현(Brian2)과 우리 엔진을 맞춰 보는 시험에만 쓴다(F-003).
    "brian2>=2.10",
]

[project.scripts]
fly-connectome = "moai_echomind_fly.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/moai_echomind_fly"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# 자료 카드의 마크다운 표 틀 — 줄을 나누면 표가 깨진다
"src/moai_echomind_fly/datasets.py" = ["E501"]
# 재현 · 분석 스크립트 — 머리말(무엇 · 언제 · 실측값)과 한 줄 결과 출력이 길다(2026-09-29 · 코드 줄은 ruff format)
"scripts/50-analysis/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data: 공식 파일(data/raw)과 컴파일된 그래프가 있어야 도는 시험",
    "heavy: 뇌 전체를 돌리는 시험 — 가드를 지난다",
]

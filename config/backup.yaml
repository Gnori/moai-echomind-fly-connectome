# 백업 (요구자 2026-09-23 "백업도 니가 적당한 자리로 처리해")
# git 밖(data/ · runs/)에 있어 이 맥에만 있는 것 중 **다시 만들기 비싼 것**을 복사한다.
# 공식 파일(data/raw · 1.0 GB)과 그래프(data/graph)는 `download` · `graph` 로 다시 만들 수 있어 뺀다.
version: backup-v1
items:                      # 저장소 뿌리 기준
  - data/datasets           # 학습 자료 묶음(모으기 약 30 분 · 체크섬 있음)
  - runs                    # 투영기 저장본 · 학습 로그 · 평가 · 성적표 · 선형 검사 · 검산 기록
exclude:
  - .heavy.lock
  - .DS_Store
destinations:               # 2026-10-05 요구자 "백업 앞으로 (~/Backups) 여기에 해" — 맥 안 한 곳만
  - path: ~/Backups/moai-echomind-fly-connectome   # 실제 경로 /Users/jackylim/Backups/moai-echomind-fly-connectome
    why: 맥 안 · 늘 있음 — 저장소를 실수로 지웠을 때
  # USB /Volumes/JKL-USB/Backups/moai-echomind-fly-connectome 는 10-05 부터 쓰지 않는다(쓰기 권한 오류 · 요구자 결정).
  #   거기 있는 것은 10-04 까지의 사본이다.

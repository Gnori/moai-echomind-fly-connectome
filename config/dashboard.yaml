# 로컬 대시보드 dashboard-v1 (R-7928) — runs/ 를 **읽기만** 해서 HTML 한 장을 만든다. 값은 여기(코드에 박지 않는다).
# 띄우기: uv run fly-connectome dashboard --serve 8770 --every 30  → http://127.0.0.1:8770/  (127.0.0.1 만 · 읽기 전용)
version: dashboard-v1
refresh_s: 60            # 페이지의 <meta http-equiv="refresh"> 초
port: 8770               # --serve 기본 포트
every_s: 30              # --serve 일 때 페이지를 다시 만드는 간격(초)
out_dir: dashboard       # runs/<out_dir>/index.html (git 밖)
train_rule: train-v4     # 학습 진행 칸이 읽는 투영기 폴더 판 — runs/projector-*-<판>/
globs:                   # runs/ 안에서 읽을 자리(가장 최근 것을 고른다)
  full_log: "full-v4-*.log"
  projector: "projector-*-train-v4"
  linear_probe: "linear-probe-*.json"
  compress: "compress-*"
  bump: "bump-check-*.json"
  scorecard: "scorecard-*"
  eval_caption: "eval-caption-*.json"
datasets_glob: "*"       # data/datasets/<glob>/meta.json
backup_md: "~/Backups/moai-echomind-fly-connectome/BACKUP.md"
links:                   # 페이지 아래 링크 — runs/dashboard/index.html 기준 상대 경로
  - ["학습 안내서", "../../docs/training/index.html"]
  - ["연구 노트", "../../docs/research/fly-connectome/index.html"]
  - ["요구사항 · 인수인계", "../../docs/requirements/"]

# 채널별 압축 · 선형 관문 (R-7469 F-004 · I §3.4) — 규칙은 **결과를 보기 전에** 적는다. 옛 판은 archive/compress-v{1,2}.yaml.
#
# 왜: 3.2 만 차원을 통째로 넣으면 선형 검사도 찍기 수준이 된다. 채널마다 64 차원으로 줄여도 진짜 배선이 앞섰다
#     (연구 노트 12 §1.1 ① — 시각 → 물체 쪽 0.705/0.571 · 몸 → 다리 0.600/0.448). 차원 ≫ 표본의 표준 처방(연구 노트 12 §3).
# 방법: 뇌마다 · 채널마다 PCA 를 **학습 나눔(train)으로만** 맞춘다. 재배선 뇌도 같은 규칙으로 따로.
# 관문: 압축한 특징으로 stats(판정 규칙 · 지금 판) 판정 → 한 칸이라도 통과한 채널만 다음 단계(F-005)로.
#
# v1(2026-09-23): k = 설명 분산 var_target 이상인 가장 작은 k(단 [k_min, k_max]) → 진짜 시각 16 · 재배선 64 로 두 뇌 절차가 달라졌다.
# v2(2026-09-23): 모든 뇌 · 채널에 같은 차원 k_fixed 64.
# v3(2026-09-24 · 결과 뒤 고침 — 까닭을 적는다): v2 는 방향만 맞추고 **크기는 그대로** 두어 뇌마다 · 채널마다 입력 크기가 달랐다.
#   실측(fly-loop-v2 학습 나눔 · 64 차원 벡터 평균 크기): 시각 진짜 0.90 대 재배선 1.77/1.80/2.07 · 몸 진짜 8.31(첫 축 하나가 5.0) 대 1.60/1.70/2.13 ·
#   촉각 0.17 대 0.03~0.08 · 미각 0.07 대 0.01~0.06. 투영기(선형 + 편향)는 입력이 클수록 편향(상수)을 빨리 벗어나 **입력이 2 배 큰
#   재배선이 먼저 배웠다**(train-v4 캡션 450 걸음: 진짜 3.42 · 재배선 s0 2.12) · 촉각 · 미각은 모든 뇌에서 사실상 상수 토큰이었다.
#   → v3 는 압축 뒤 채널마다 **학습 나눔의 평균 크기(L2)로 나눠 모든 뇌 · 채널의 평균 크기를 1 로** 맞춘다(unit_scale).
#   축 사이 비율(PCA 스펙트럼)은 그대로 — 축마다 백색화하면 분산 0 에 가까운 꼬리 축(미각 64 축 std 0.000)이 잡음으로 부풀기 때문.
#   압축기(PCA 방향)는 v2 와 같고 scale 하나만 더 저장한다. 관문 판정도 v3 특징으로 다시 한다(릿지는 크기에 민감).
version: compress-v3
method: pca
k_fixed: 64           # 모든 뇌 · 채널에 같은 차원(차원이 이보다 작은 채널은 그 차원 그대로)
unit_scale: true      # v3 — 채널마다 학습 나눔 압축 벡터의 평균 L2 크기로 나눈다(뇌 · 채널 모두 평균 크기 1)
scale_floor: 1.0e-6   # 크기가 0 인 채널(전부 침묵)은 이 값으로 나눠 폭주를 막는다
var_target: 0.95      # v1 규칙(k_fixed 가 있으면 쓰지 않는다 — 기록용)
k_min: 16
k_max: 64
center: true

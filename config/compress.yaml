# 채널별 압축 · 선형 관문 compress-v1 (R-7469 F-004 · I §3.4) — **결과를 보기 전에 적은 규칙**(2026-09-23).
#
# 왜: 3.2 만 차원을 통째로 넣으면 선형 검사도 찍기 수준이 된다. 채널마다 64 차원으로 줄여도 진짜 배선이 앞섰다
#     (연구 노트 12 §1.1 ① — 시각 → 물체 쪽 0.705/0.571 · 몸 → 다리 0.600/0.448). 차원 ≫ 표본의 표준 처방(연구 노트 12 §3).
# 방법: 뇌마다 · 채널마다 PCA 를 **학습 나눔(train)으로만** 맞춘다. 재배선 뇌도 같은 규칙으로 따로.
# k(남길 차원): 설명 분산이 var_target 이상인 가장 작은 k — 단 [k_min, k_max] 안.
#   (k_min 16: 16 아래에서 차이가 흐려졌다 · k_max 64: 64 에서도 차이가 남았다 — 위 실측)
# 관문: 압축한 특징으로 stats(판정 규칙 · 지금 판) 판정 → 한 칸이라도 통과한 채널만 다음 단계(F-005)로.
version: compress-v1
method: pca
var_target: 0.95
k_min: 16
k_max: 64
center: true

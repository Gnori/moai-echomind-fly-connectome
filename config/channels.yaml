# 채널 표 (R-3340 F-012 · I §3.2) — LLM 에 넣는 초파리 신경 신호 묶음.
# 요구자(2026-09-21): "초파리의 다양한 신호 데이터를 벡터화해서 LLM" · "성적인 전기신호 데이터까지도 · 시신경 · 촉각"
# 뉴런은 주석 칸으로만 고른다(손으로 고른 목록 없음 → 채운 수 0). 단위 = unit 칸들의 조합 × 좌우.
# 전기 신호 = 창을 bins 로 나눈 구간마다 ① 발화율(Hz) ② 평균 탈분극(mV, v − v0).
version: channels-v3   # 2026-09-26 — channels-v2 + smell_ln(안테나엽 LN 4 종 · 연구 노트 14 §5 · M1b 에서 투사 뉴런보다 좌우를 잘 가름). 옛 판 config/archive/channels-v2.yaml
# channels-v2 = 2026-09-23 — channels-v1 + space(중심복합체 · 운동 감지 수평/수직계 · R-7469 F-008)
window_ms: 300
bins: 3
rate_scale_hz: 20.0     # log1p(rate) / log1p(scale) 로 정규화
depol_scale_mV: 7.0     # 쉬는 전위에서 문턱까지(−52 → −45 mV)
channels:
  vision:      # 시신경 → 시각 투사 뉴런(LC · LPLC 등)
    select: {superclass: [visual_projection]}
    unit: [type]
  touch:       # 다리 털 · 관절 · 날개 · 몸 기계감각
    select: {class: [mechanosensory, mechanosensory_tactile, mechanosensory_proprioceptive]}
    unit: [subclass, entryNerve]
  hearing:     # 존스턴 기관 청각
    select: {subclass: [auditory]}
    unit: [type]
  smell:       # 후각 투사 뉴런(촉각엽 → 측각 · 버섯체)
    select: {class: [ALPN]}
    unit: [type]
  smell_ln:    # 안테나엽 국소 뉴런 4 종(26 뉴런) — 그래프 선형 전파 같은 쪽 편향 0.40~0.48(PN 0.08~0.15 · 노트 14 §5) ·
               # M1b: 좌우 차 5~10 % · 창 1 s 이상에서 좌우를 가름(runs/odor-contrast-20260926-184048.json)
    select: {type: [v2LN3A1_b, lLN2X02, lLN15, lLN2F_b]}
    unit: [type]
  taste:       # 미각 감각 뉴런 · 접촉 페로몬(receptorType 에 ppk23 추정)
    select: {class: [gustatory]}
    unit: [subclass, receptorType]
  courtship:   # 구애 · 성 회로 — fru/dsx 발현 추정 또는 암수 차이 표시(감각 뉴런은 뺀다)
    select_any:
      fruDsx: [fru_high, fru_low, coexpress_high, coexpress_low, dsx_high]
      dimorphism: [male-specific, sexually dimorphic, potentially sexually dimorphic, potentially male-specific]
    exclude_superclass: [cb_sensory, vnc_sensory, ol_sensory, sensory_ascending]
    unit: [type]
  value:       # 버섯체 출력(좋다/나쁘다 방향 — 학습 규칙이 없어 고정 편향만)
    select: {class: [MBON]}
    unit: [type]
  body:        # 상행 뉴런(신경삭 → 뇌) — 몸 상태
    select: {superclass: [ascending_neuron]}
    unit: [type]
  motor:       # 하강 뉴런(뇌 → 신경삭) — 회로가 스스로 내는 운동 명령
    select: {superclass: [descending_neuron]}
    unit: [type]
  space:       # 공간 — 중심복합체 나침반(EPG · PEN · PEG · Δ7) · 이동 벡터(PFN · hΔB) · 목표/조향(FC2 · PFL3) · 회전(HS · VS)
    # 단위 = instance(PB 사구체 · 구획을 지킨다 — 봉우리 위상을 읽으려면 구획이 필요하다)
    select: {type: [EPG, EPGt, PEN_a(PEN1), PEN_b(PEN2), PEG, Delta7, PFNa, PFNd, PFNm_a, PFNm_b, PFNp_a, PFNp_b,
                    hDeltaB, FC2A, FC2B, FC2C, PFL3, HSN, HSE, HSS, VS]}
    unit: [instance]

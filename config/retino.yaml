# 시야 자리 대응 retino-v1 (R-7469 F-008 2단계 · I §3.3) — 시각 투사 뉴런(LC · LPLC …)마다 **고도**를 계산한다.
#
# 재료: 공식 주석의 기둥 좌표 assignedOlHex1/2 — 시각엽 기둥 뉴런 23,720 개에만 있다(LC/LPLC 에는 없다).
# 방법: 뉴런이 입력받는 기둥 뉴런들의 좌표를 **시냅스 수로 가중 평균**한다(우리 제안 — 문헌에서 그대로 확인하지 못함).
#       T4/T5 는 좌표가 없어 한 단계 더 거슬러(T4/T5 의 입력 기둥 가중 평균) 쓴다 — LPLC 처럼 소엽판에서 받는 뉴런용.
#
# 방향 규약(2026-09-23 연결 지도로 확인 — runs/ 에 기록):
#   y = hex1 + hex2 가 **등 쪽(위)** 으로 커진다 —
#     등 가장자리 광수용체 R7d · R8d 의 출력 기둥 y ≈ 64(전체 기둥 평균 38.8) ·
#     수평계 HSN(위) 47 > HSE(적도) 40 > HSS(아래) 25 (Hausen · Krapp 의 HS 수용장 순서와 같다).
#   x = hex2 − hex1(눈 안의 앞 · 뒤)은 **방향을 확정하지 못했다** → retino-v1 은 고도만 쓴다. 방위는 눈 단위(좌/우).
#
# 고도 변환(선언 · 근사): 기둥 y 의 [최소, 최대] 를 elevation_range_deg 로 **선형** 대응.
#   범위: 초파리 겹눈 시야는 바로 위(+90°)에서 아래 약 −70° 까지(Zhao et al. 2025 Nature — 연구 노트 12 [3D-11]).
#   실제 눈 지도는 선형이 아니다(적도 근처 촘촘) — 근사임을 결과에 적는다.
version: retino-v1
select:
  superclass: [visual_projection]
column_hex_types: auto            # 좌표가 붙은 모든 기둥 뉴런
two_hop_types_prefix: [T4, T5]    # 좌표가 없는 운동 기둥 뉴런 — 입력 기둥으로 한 번 더
elevation_range_deg: [-70.0, 90.0]
min_input_synapses: 20            # 좌표를 가진 입력이 이보다 적으면 missing

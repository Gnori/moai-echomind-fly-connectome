# 시야 자리 대응 retino-v2 (R-7469 F-008 2단계 · I v2 §9.2) — 시각 투사 뉴런(LC · LPLC …)마다 **고도와 방위**를 계산한다.
# 옛 판 retino-v1(고도만)은 config/archive/retino-v1.yaml · 자료 fly-loop-v2 는 v1 로 모았다.
#
# 재료: 공식 주석의 기둥 좌표 assignedOlHex1/2 — 시각엽 기둥 뉴런 23,720 개에만 있다(LC/LPLC 에는 없다).
# 방법: 뉴런이 입력받는 기둥 뉴런들의 좌표를 **시냅스 수로 가중 평균**한다(우리 제안 — 문헌에서 그대로 확인하지 못함 · v1 과 같음).
#       T4/T5 는 좌표가 없어 한 단계 더 거슬러(T4/T5 의 입력 기둥 가중 평균) 쓴다 — LPLC 처럼 소엽판에서 받는 뉴런용.
#
# 축 규약(retino-v2 · 2026-09-23 확정 · 연구 노트 13 §4):
#   h = hex1 − hex2 가 **앞쪽(정면)** 으로 커진다 — 공개 정의: MaleCNS 시각 경로 논문(Nern 연구실 · Cell 2026 ·
#     bioRxiv 10.64898/2025.12.22.696097v2) 방법 "x = hex1_id − hex2_id … h = x" · 그림 1b "high h corresponds to anterior".
#     그래프 독립 검증(runs/lc4-dn-axis-20260923.json): LC4 → DNp02(앞쪽 물체 담당 · Dombrovski et al. 2023 Nature) 시냅스가
#     x = hex2 − hex1 과 −0.76/−0.85(L/R) · LC4 → DNp11(뒤쪽) 은 +0.73/+0.80 → h 로는 부호가 반대(DNp02 +, DNp11 −).
#   v = hex1 + hex2 가 **등 쪽(위)** 으로 커진다 — v1 에서 확인(R7d · R8d 출력 기둥 v ≈ 64 · HSN 47 > HSE 40 > HSS 25) · 논문의 v 와 같다.
#
# 방위 변환(선언 · 근사): 오른눈 h 의 [최소, 최대] 를 azimuth_range_deg 로 **선형** 대응 · 왼눈은 부호 반전(거울).
#   방위 부호는 task.yaml 의 세계 방위와 같다: **+ = 왼쪽 · 0° = 정면 · ±180° = 뒤**.
#   범위 [−170, +10] = 오른눈은 정면을 10° 넘어 왼쪽까지 보고(양안 겹침) 뒤로 170° 까지 — **선언 값**.
#   근거: 초파리 겹눈 하나의 수평 시야는 정면 겹침 구역부터 거의 뒤까지 닿는다(Zhao et al. 2025 Nature 눈 지도) —
#   단 그 지도는 FAFB(암컷) 기둥 번호 기준이라 MaleCNS 로 옮기는 표가 없어 수치는 우리 선언이다(연구 노트 13 §4.3 · §6).
#   실제 눈 지도는 선형이 아니다(정면 근처 촘촘) — 근사임을 결과에 적는다.
# 고도 변환: v1 그대로 — v 의 [최소, 최대] 를 elevation_range_deg 로 선형(Zhao et al. 2025: 바로 위 +90° ~ 아래 약 −70°).
# 대조군: `retinotopy build --shuffle azimuth|elevation --seed N` — 같은 종류 · 같은 눈 안에서 값을 뒤섞은 대응표.
version: retino-v2
select:
  superclass: [visual_projection]
column_hex_types: auto            # 좌표가 붙은 모든 기둥 뉴런
two_hop_types_prefix: [T4, T5]    # 좌표가 없는 운동 기둥 뉴런 — 입력 기둥으로 한 번 더
elevation_range_deg: [-70.0, 90.0]
azimuth_range_deg: [-170.0, 10.0] # 오른눈: h 최소(뒤) → −170° · h 최대(앞) → +10°. 왼눈 = 부호 반전. 선언(근사)
min_input_synapses: 20            # 좌표를 가진 입력이 이보다 적으면 missing

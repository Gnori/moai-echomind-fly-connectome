  DNp42: {name: 물러남(뒷걸음), note: "켜면 뒤로 물러남(머리 떼면 사라짐)", source: "Braun 2024 · 노트 18 §12", check: 원문}
  DNb01: {name: 멈춤 · 얼어붙기, note: "켜면 앞다리를 움찔한 뒤 대부분 얼어붙음 · 날다가 같은 쪽으로 꺾기에도", source: "Cande 2018 · 노트 18 §12", check: 원문}
  DNp03: {name: 고개 돌리기(반대쪽으로), note: "한쪽 켜면 반대쪽으로 고개를 돌림 · 끄면 빠른 다가옴에 고개 돌림이 준다", source: "노트 18 §12", check: 원문}
  DNg11: {name: 앞다리 비비기 → 두 손 비비기, note: "켜면 앞다리 비비기(머리 떼도) · 우리 그래프 부호는 억제", source: "Braun 2024 · 노트 18 §12", check: 원문}
  DNg07: {name: 머리 손질 → 얼굴 닦기, note: "DNg07 + DNg08 을 켜는 계통에서 머리 손질 · 둘을 나눌 수 없음", source: "Cande 2018 · 노트 18 §12", check: 원문}

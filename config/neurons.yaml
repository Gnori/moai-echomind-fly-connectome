  DNge078: {name: 더듬이 손질(aDN2) → 귀 쓰다듬기, note: "켜는 동안 내내 더듬이 손질", source: "Hampel 2015 · 노트 18 §12", check: 원문}
  DNg62: {name: 더듬이 손질(aDN1) → 귀 쓰다듬기, note: "켜면 짧게 끊기는 더듬이 손질", source: "Hampel 2015 · 노트 18 §12", check: 원문}
  DNge173: {name: 주둥이 뻗기 → 입 벌림, note: "켜면 주둥이 뻗기 · 꺼도 설탕에 주둥이 뻗기는 그대로", source: "노트 18 §12", check: 원문}
  DNge174: {name: 주둥이 뻗기 → 입 벌림, note: "켜면 주둥이 뻗기", source: "노트 18 §12", check: 원문}
  aSP22: {name: 주둥이 뻗기 · 앞다리 뻗기 → 입 벌림, note: "켜면 주둥이 뻗기 · 앞다리 뻗기 · 배 움직임", source: "노트 18 §12 · McKellar 2019", check: 원문}
  DNg12_a: {name: 머리 쓸기 · 다리 비비기 → 얼굴 닦기, note: "DNg12 무리 — 머리 쓸기와 다리 비비기를 번갈아 · 어느 아형인지는 모름", source: "Guo 2022 · 노트 18 §12", check: 원문}

# 버섯체 가소성 plasticity-v1 (R-7469 F-007 · I v2 §8) — KC → MBON 시냅스 세기가 도파민(DAN) 신호로 바뀌는 규칙.
# ⚠️ 결과를 보기 전에 적었다(2026-09-23). 값은 **선언**이고 시간 창의 경계만 원문이다(연구 노트 13 §3.2 · §3.3).
#   바꾸면 판을 올린다. 아직 쓰는 코드 없음 — plasticity-probe(먼저 잴 것) 가 첫 사용자.
#
# 바뀌는 곳: KC → MBON 연결(그래프 실측 61,210 · 시냅스 463,640)의 배율 m_ij 만. 존재 · 시냅스 수 · 부호 불변.
# DAN(PAM 316 · PPL1 16)의 연결 부호는 0 그대로 — DAN 발화는 조절 신호로만 읽는다.
version: plasticity-v1
targets:
  pre_class: [Kenyon_Cell]
  post_class: [MBON]
  dan_type_prefix: [PAM, PPL1]
rule:
  form: "dm_ij/dt = -eta * D_c(j)(t) * e_i(t) * m_ij   (곱셈형 · 약화만 · 앞 짝짓기)"
  kc_trace_tau_s: 5.0            # KC 흔적 ē_i — 선언(문헌 창: Hige 2015 냄새 시작 0.2 s 뒤 · Cohn 2015 0.5 s 안 · Aso & Rubin 2016 30 s 안)
  dan_signal_tau_s: 0.3          # 구획 DAN 신호 D_c — 선언(0.2~0.5 s · Hige 4 펄스 2 Hz · Handler 2019 수백 ms)
  m_min: 0.1                     # 배율 바닥(0 아래로 안 감) — 선언(Springer · Jürgensen 0 · DoomFly 0.1)
  m_max: 1.0                     # 강화 없음(초기 = 최대 · Jiang & Litwin-Kumar 2021)
  backward_pairing: none         # 뒤 짝짓기(DAN 먼저 → KC)는 1판에서 변화 없음(Hige 2015 0.5 s 뒤 짝짓기 변화 없음) · 강화(Handler 2019)는 2판
  recovery_tau_h: null           # 에피소드 안 회복 없음 · 필요하면 1~3 h(Hige ≥ 40 분 · Perisse 3~4 h)
eta:
  how: calibrate                 # 값이 아니라 목표로 보정한다(plasticity-probe)
  pairing: {odor_s: 1.0, dan_s: 1.0}
  target_cs_plus_drop: [0.5, 0.9]      # 짝짓기 한 번에 그 구획 MBON 의 CS+ 구동이 50~90 % 감소(Hige 2015: 118 → 24 발화 · EPSC −90 %)
  target_unpaired_change_max: 0.25     # 짝 안 지은 냄새는 25 % 미만 변화
compartments:
  how: "MBON 마다 시냅스가 가장 많은 DAN 종류 = 그 MBON 의 구획(그래프에서 · 문헌 명명법과 일치 확인 — 노트 13 §3.1)"
  check: {PPL101: MBON11, PAM01: MBON01, PAM08: MBON05, PAM10: MBON06, PAM11: MBON07, PPL103: MBON12, PPL106: MBON14}
teaching:                        # 세계 사건 → DAN 직접 자극(포아송 킥 · 광유전 실험 흉내 — 회로가 스스로 DAN 을 못 켠다)
  pulse_s: 1.0
  rate_hz: 100.0                 # 선언 — Shiu 기본 자극(150) 아래
  reward:                        # 먹이 도착 → 보상 DAN → 회피 MBON(글루탐산) 약화
    event: food_reached
    dan_types: [PAM01, PAM15, PAM02, PAM07, PAM08, PAM03, PAM04, PAM11]
  punishment:                    # 다가오는 물체에 부딪힘 → 처벌 DAN → 접근 MBON 약화
    event: looming_hit
    dan_types: [PPL101, PPL103, PPL106]
controls: [off, random_reward, rewired_pn_kc, dan_compartment_swap, before]   # 대조군 다섯(I v2 §8.3)
probe_first:                     # 잠금이 풀린 뒤 몸 없이 창 몇 개로 먼저 잰다 — 결과가 나쁘면 손으로 고치지 않고 기록
  - kc_active_fraction (목표 0.05~0.10 · physiology-v1 kc_sparsity)
  - mbon_fires_from_kc
  - dan_pulse_changes_compartment_mbon
  - eta_calibration
mbon_probe:                      # M3 뒤 진단(2026-10-05 · 결과 전 선언) — MBON 마다 입력이 문턱에 얼마나 못 미치나(mbon_probe.py)
  stimulus: vinegar6             # config/fit.yaml kc_probe.stimuli 이름(M3 와 같은 냄새)
  orn_rate_hz: 150.0             # Shiu 기본 자극(kc_probe 와 같음)
  windows_ms: [100, 300, 1000]   # M3 창 0.1 s · 결정 하나 0.3 s · 1 s(느린 누적이 닿나)
  top_sources: 3                 # MBON 마다 억제 출처 · KC 종류를 몇 개까지 적나(보기용)
  kc_type_min: 100               # 종류별 KC 켜짐 비율을 적을 최소 뉴런 수(fit.yaml kc_min_type_size 와 같음)
  verdict:                       # 침묵 까닭 — fires(발화 ≥ 1) · inhibition(KC+흥분은 문턱 넘는데 억제로 못 넘음) ·
    kc_none_mV: 0.01             #   no_kc_input(KC 몫 평균 ≤ 이 값) · weak_kc(나머지 — KC 몫이 모자람 · 필요 배수를 함께 적음)
probe_controls:                  # 2026-10-06 · 결과 전 선언 — 가소성 대조(I v2 §8.3 의 다섯을 몸 없이 짧게) · 요구자 "응 남은것 진행해"
  # 10-06 첫 재기(진짜 kc-mbon-a · 시험 100 ms · η 0.001): 보상 구획 CS+ 76 → 28(−63 % · 5/5) · η 0: 76 → 84.
  eta: 0.001                     # 위 재기로 고른 값(0.01 은 → 0 으로 과함)
  test_ms: 300                   # 시험 창(100 ms 는 발화 13~18 로 작아 늘림)
  update_ms: 100                 # 규칙 갱신 창(첫 재기와 같음)
  odor_hz: 150.0
  cs_plus: [ORN_DM1, ORN_DM4, ORN_DP1m, ORN_DM2, ORN_VA2, ORN_VM2]   # 식초 6(fit.yaml kc_probe vinegar6)
  cs_minus_n: 6                  # 짝 안 지은 냄새 = CS+ 를 뺀 ORN 종류에서 씨앗으로 6 개(고른 목록은 결과 파일에)
  cs_minus_seed: 0
  cs_minus_screen:               # 2026-10-06 · 결과 전 — 첫 CS−(씨앗 0)가 보상 구획 MBON 을 안 켜 특이성을 잴 수 없었음 → 다시 고른다
    candidates: 20               # CS+ 밖 ORN 6 종 묶음 20 개(씨앗 first_seed ~ +19)
    first_seed: 1
    sim_seed: 0
    min_rel_response: 0.3        # 짝짓기 전 보상 구획 MBON 발화가 CS+ 의 30 % 이상
    max_kc_overlap: 0.3          # 켜진 KC 가 CS+ 와 30 % 이하로 겹침(Jaccard)
    pick: max_reward_spikes      # 남은 것 중 보상 구획 발화가 가장 큰 것 — 판정 기준은 pass.control_change_max 그대로
  unpaired_gap_s: 3.0            # 시간이 어긋난 보상: 보상 1 s → 쉼 3 s → 냄새 1 s(DAN 신호 τ 0.3 s 라 겹침 거의 없음)
  shuffle_seed: 100              # 구획 표 섞기 씨앗(+ 시행 씨앗)
  conditions: [paired, unpaired, punish, shuffled, "off"]   # cs_minus 는 paired 안에서 함께 잰다 · "off" 는 따옴표(YAML 이 거짓으로 읽음 · 10-06 첫 실행이 이것으로 깨짐)
  pass:                          # 씨앗 합 기준
    paired_drop: [0.5, 0.9]      # 짝지은 냄새 · 보상 구획 MBON 감소(Hige 2015 약 80 % · eta.target_cs_plus_drop 과 같음)
    control_change_max: 0.25     # 짝 안 지은 냄새 · 어긋난 보상 · 표 섞기 · 가소성 끔 — 보상 구획 변화(감소) 상한(eta.target_unpaired_change_max 와 같음)
    punish_drop_min: 0.5         # 처벌 DAN 짝짓기 — 처벌 구획 MBON 은 이만큼 줄고 보상 구획은 control_change_max 이하

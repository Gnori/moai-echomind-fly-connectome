# 생리 목표 physiology-v1 (R-7469 F-006 · I v2 §7.3) — 회로 학습의 손실에 넣는 **알려진 생리 반응**.
# ⚠️ 결과를 보기 전에 적었다(2026-09-23). 항목을 더하거나 값을 바꾸면 판을 올린다.
#
# 왜: 커넥톰을 고정해도 종류 매개변수의 여러 조합이 같은 과제 출력을 낸다(퇴화 · Beiran & Litwin-Kumar 2025).
#     과제 손실만으로 맞추면 생물학적 해가 보장되지 않는다 → 소수 뉴런의 알려진 반응을 제약으로 건다.
# 손실: L = Σ_k weight_k · ((측정_k − target_k) / tolerance_k)² + 과제 항(관문 통과 칸 선형 해독) + 규제(초기값에서 멀어진 정도).
#   범위 목표([lo, hi])는 안에 들면 0, 벗어난 거리를 tolerance 로 나눈다.
# 확인 수준: P = 원문 · A = 초록/그림 · S = 2차 자료(연구 노트 13 §2.4 표 · 참고 문헌 번호는 그 노트).
version: physiology-v1
items:
  # ---- 도망 반사 (scope escape-small · escape) — bench/escape.py 의 채점 5 항목 그대로
  - name: gf_response_prob
    scope: [escape-small, escape]
    measure: escape.gf_hit                # 다가옴 시행 중 GF 가 반응한 비율(loom-v1 · 40 시행)
    target: [0.5, 1.0]
    tolerance: 0.1
    weight: 1.0
    source: "von Reyn et al. 2014 Nat Neurosci 17:962 — 다가옴 대부분이 문턱 근처"
    level: A
  - name: gf_spikes_per_response
    scope: [escape-small, escape]
    measure: escape.gf_per_hit
    target: [1.0, 2.0]
    tolerance: 0.5
    weight: 1.0
    source: "von Reyn 2014 · 2017 — 단일 GF 기록"
    level: A
  - name: gf_latency_ms
    scope: [escape-small, escape]
    measure: escape.gf_latency_ms
    target: [10.0, 60.0]
    tolerance: 10.0
    weight: 0.5
    source: "von Reyn 2014"
    level: A
  - name: cns_quiet_hz
    scope: [escape-small, escape, space]
    measure: escape.pop_rate_hz           # 자극받지 않은 뉴런 평균 발화율
    target: [0.0, 0.05]
    tolerance: 0.02
    weight: 2.0                           # 뇌가 들끓는 해를 강하게 막는다
    source: "Shiu 2024 — 쉬는 상태 침묵 · FLYCNS 채점"
    level: P
  - name: rewired_gf_silent
    scope: [escape-small, escape]
    measure: escape.null_gf_hit           # 같은 매개변수를 재배선에 넣었을 때 GF 반응(대조)
    target: [0.0, 0.1]
    tolerance: 0.05
    weight: 1.0
    source: "R-3340 F-004 · 배선 덕인지 가르는 항 — 학습이 재배선까지 살리면 실패"
    level: P
  # ---- 다가옴 조율 (scope escape) — LC/LPLC 13 종의 상대 반응 세기
  - name: loom_tuning_profile
    scope: [escape]
    measure: loom.relative_response       # 종류별 최대 발화율을 LC17 로 나눈 벡터 · 코사인 유사도
    target: loom-v1.amplitude             # config/loom.yaml 의 Turner 2022 상대 세기
    tolerance: 0.1                        # 1 − 코사인 유사도
    weight: 1.0
    source: "Turner, Krieger, Pang & Clandinin 2022 eLife 11:e82587 (Dryad)"
    level: P
  # ---- 중심복합체 나침반 (scope space)
  - name: epg_bump_fwhm_deg
    scope: [space]
    measure: bump.fwhm_deg                # 시야 자리 단서를 돌릴 때 EPG 봉우리 반치폭
    target: 82.3
    tolerance: 11.5
    weight: 1.0
    source: "Seelig & Jayaraman 2015 Nature 521:186 — FWHM 82.3 ± 11.5°"
    level: P
  - name: epg_bump_tracks_heading
    scope: [space]
    measure: bump.circ_corr               # inspect bump 의 |원형 상관|(EPG 위상 대 몸 방향)
    target: [0.5, 1.0]
    tolerance: 0.2
    weight: 1.0
    source: "Seelig & Jayaraman 2015 · Turner-Evans 2017 eLife — 봉우리 속도 = 몸 각속도"
    level: P
  - name: epg_bump_persists_dark_s
    scope: [space]
    measure: bump.persist_s               # 단서를 끈 뒤 봉우리(길이 > 0.3)가 유지되는 시간
    target: [2.0, 30.0]                   # 30 s 넘게 유지된다(원문) — 우리 창 길이에 맞춰 하한 2 s
    tolerance: 1.0
    weight: 0.5
    source: "Seelig & Jayaraman 2015 — 어둠에서 30 s 이상"
    level: P
  # ---- 수평계 (scope space · 검증에만 · 이미 y 축 확인에 씀)
  - name: hs_receptive_field_order
    scope: [space]
    measure: hs.rf_elevation_order        # HSN > HSE > HSS 의 수용장 고도 순서(순위 상관)
    target: 1.0
    tolerance: 0.5
    weight: 0.3
    source: "Schnell et al. 2010 J Neurophysiol 103:1646"
    level: A
  # ---- 후각 · 버섯체 (F-007 준비 · scope 는 v2 에서)
  - name: kc_sparsity
    scope: []                             # 아직 어느 scope 에도 안 넣는다 — plasticity-probe 가 먼저 잰다
    measure: mb.kc_active_fraction        # 냄새 자극 시 발화한 KC 비율
    target: [0.05, 0.10]
    tolerance: 0.03
    weight: 1.0
    source: "Lin et al. 2014 Nat Neurosci 17:559 — 냄새당 KC 5~10 %"
    level: P

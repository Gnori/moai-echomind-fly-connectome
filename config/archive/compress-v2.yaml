# 채널별 압축 · 선형 관문 compress-v1 (R-7469 F-004 · I §3.4) — **결과를 보기 전에 적은 규칙**(2026-09-23).
#
# 왜: 3.2 만 차원을 통째로 넣으면 선형 검사도 찍기 수준이 된다. 채널마다 64 차원으로 줄여도 진짜 배선이 앞섰다
#     (연구 노트 12 §1.1 ① — 시각 → 물체 쪽 0.705/0.571 · 몸 → 다리 0.600/0.448). 차원 ≫ 표본의 표준 처방(연구 노트 12 §3).
# 방법: 뇌마다 · 채널마다 PCA 를 **학습 나눔(train)으로만** 맞춘다. 재배선 뇌도 같은 규칙으로 따로.
# k(남길 차원): 설명 분산이 var_target 이상인 가장 작은 k — 단 [k_min, k_max] 안.
#   (k_min 16: 16 아래에서 차이가 흐려졌다 · k_max 64: 64 에서도 차이가 남았다 — 위 실측)
# 관문: 압축한 특징으로 stats(판정 규칙 · 지금 판) 판정 → 한 칸이라도 통과한 채널만 다음 단계(F-005)로.
# v2(2026-09-23 · 결과 뒤 고침 — 까닭을 적는다): v1 의 "설명 분산 0.95" 규칙은 진짜 배선의 시각을 16 차원, 재배선을 64 차원으로
#   줄여 **두 뇌의 절차가 달라졌다**(대조군 원칙 위반) · 게다가 물체 정보는 분산이 작은 방향에 있어 16 차원에서 잘렸다
#   (압축 전 시각 → 물체 있음 0.851 → 압축 뒤 0.737 · runs/compress-fly-loop-v2-compress-v1/gate.json).
#   → v2 는 **모든 뇌 · 모든 채널에 같은 차원 k_fixed** 를 쓴다. 값 64 = v1 범위의 상한이자 옛 자료에서 64 차원으로도
#   진짜 > 섞은 이 남았던 근거(연구 노트 12 §1.1 ①). 이래도 안 되면 목표를 보는 압축(PLS)을 v3 로.
version: compress-v2
method: pca
k_fixed: 64           # 모든 뇌 · 채널에 같은 차원(차원이 이보다 작은 채널은 그 차원 그대로)
var_target: 0.95      # v1 규칙(k_fixed 가 있으면 쓰지 않는다 — 기록용)
k_min: 16
k_max: 64
center: true

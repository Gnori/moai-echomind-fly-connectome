# 무거운 실행 가드 (R-3340 2.3 · I §2.3)
# 맥 한 대의 GPU·통합 메모리를 요구자 화면·다른 세션과 같이 쓴다(2026-09-06 커널 패닉 전례).
version: guard-v1
min_free_percent: 40        # memory_pressure 의 "System-wide memory free percentage"
qwen_weights_gb: 28         # Qwen 을 올릴 때는 이만큼을 더 빼고도 문턱을 넘어야 한다
lock_file: runs/.heavy.lock # 무거운 실행은 한 번에 하나
# 투영기 학습(Qwen 역전파)은 처음에 한 걸음 최대 약 90 GB 였다(층별 역전파 59b9b29 뒤 약 32 GB).
# 요구자 2026-09-22 "이 학습에만 풀고 지금 돌림" — 학습만 **시작 전 여유 80 % 이상**이면 돌고,
# 도는 동안은 잠금으로 다른 무거운 실행을 막는다.
# 2026-09-23 요구자 "문턱을 40%로 낮춰 지금 바로" — 층별 역전파 뒤 실측 최대 32 GB(총 137 GB) 이고 실행 중 감시가 있어
# 평소 문턱(40 %)과 같게 내림. 옛 값 80(90 GB 먹던 때 · 2026-09-22).
training_min_free_percent: 40
# 학습 중 감시(2026-09-22 — 13 시간 뒤 103 GB · 스왑 42 GB 까지 불어난 뒤 넣음).
# 캐시가 걸음마다 쌓였다 → 상한을 두고 걸음마다 비운다. 넘치면 저장하고 멈춘다.
training_cache_limit_gb: 2
training_check_every: 5            # 몇 걸음마다 시스템 여유 · 프로세스 메모리를 보나
training_abort_free_percent: 25    # 시스템 여유가 이 아래면 멈춤
training_abort_footprint_gb: 50    # 프로세스 전체(phys_footprint)가 이 위면 멈춤(정상 28 GB)
# 성적표 중 감시(2026-09-26 · R-7469 W loop 잔여 5) — v5 성적표 13 시간 동안 감시가 없었다(학습에만 있었음).
# 에피소드마다 보고, 넘치면 끝난 에피소드까지 저장하고 멈춘다(끝 코드 3). 가장 큰 위험은 다른 앱(언리얼 141 GB 전례).
scorecard_check_every: 1           # 몇 에피소드마다
scorecard_abort_free_percent: 25
scorecard_abort_footprint_gb: null # 성적표 프로세스 최대치는 아직 안 쟀다 — 재기 전엔 시스템 여유만 본다
# 전체 순서 스크립트(bin/run_full_v*.sh)가 단계 사이 메모리 여유를 기다리는 간격 · 한도
script_wait_every_s: 30
script_wait_max_min: 30            # 이만큼 기다려도 문턱 아래면 중단(끝 코드 3)

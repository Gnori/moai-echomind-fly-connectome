# 회로 학습 범위(R-7469 F-006 · I v2 §7.1) — 무엇을 배우나를 **이름으로 잠근다**.
# 매개변수 = 종류마다 막 시간 상수 · 문턱 + 종류 쌍마다 배율(α ≥ 0). 연결 수 · 부호 · 상대 · w_scale · ipsi_release 는 불변.
# 파일: data/graph/<그래프>.params-<version>-<scope>.npz (sim-v3 매개변수 파일 · cellparams.py)
version: sim-v3
bounds:                         # 선언(로그 매개화 범위 · I v2 §7.1)
  tau_ms: [5.0, 200.0]
  v_th_above_rest_mV: [2.0, 15.0]
  alpha: [0.1, 10.0]
scopes:
  escape-small:                 # 1 단계(CMA-ES · 매개변수 ≤ 50 목표)
    types_from_loom: true       # loom.yaml amplitude 의 다가옴 LC/LPLC 13 종
    types: [DNp01, DNp02, DNp04, DNp11]
    pair_min_synapses: 100      # 이 이상 시냅스가 오가는 종류 쌍만 α 를 둔다
    pair_dst: [DNp01, DNp02, DNp04, DNp11]   # 출력 쌍(LC/LPLC → 하강)만 — 전부 두면 쌍 85 · 매개변수 119(목표 ≤ 50 넘음 · 2026-10-01 실측)
                                # 🔒 확정 2026-10-01(요구자 "니가 최적이라 생각하는걸로 해바") — 결과 전
  kc-sparse-a:                  # 연구 노트 16 §3 — KC 주요 9 + APL 의 τ · 문턱(20) + KC → APL 쌍(9) = 29 · M0 에서 자극 PN ≥ 약 120 Hz 일 때
    types: [KCg-m, KCab-s, KCab-m, KCab-c, "KCa'b'-ap2", KCg-d, "KCa'b'-m", "KCa'b'-ap1", KCab-p, APL]
    pair_min_synapses: 500
    pair_dst: [APL]
    measure: mb
    cmaes: {trials: 3, generations: 50}   # 연구 노트 16 §6 M1 — 양성 씨앗 3 · 50 세대(범위별 덮어쓰기)
  kc-sparse-b:                  # 연구 노트 16 §3 — 같은 10 종 τ · 문턱(20) + 묶음 배율 4 = 24 · 자극 PN 이 그보다 약할 때
    types: [KCg-m, KCab-s, KCab-m, KCab-c, "KCa'b'-ap2", KCg-d, "KCa'b'-m", "KCa'b'-ap1", KCab-p, APL]
    pair_min_synapses: null
    groups:
      - {name: ALPN-KC, src: {class: [ALPN]}, dst: {class: [Kenyon_Cell]}}
      - {name: KC-APL, src: {class: [Kenyon_Cell]}, dst: {type: [APL]}}
      - {name: APL-KC, src: {type: [APL]}, dst: {class: [Kenyon_Cell]}}
      - {name: KC-KC, src: {class: [Kenyon_Cell]}, dst: {class: [Kenyon_Cell]}}
    measure: mb
    cmaes: {trials: 3, generations: 50}   # 연구 노트 16 §6 M1 — 양성 씨앗 3 · 50 세대(범위별 덮어쓰기)
  kc-sparse-c:                  # 2026-10-05 · 결과 전 — kc-sparse-b 와 매개변수 · 묶음이 같고 손실만 다름(physiology-v4 엽 항목)
    # 왜: b 의 진짜 학습이 KCab-m 문턱만 낮춰 KC 를 한 종류에 몰았다(αβ-m 37 % · 나머지 8 종 0 · 평균 4.9 %) →
    #     MBON 67/97 에 KC 발화 0(runs/mbon-probe-20261005-010155.json). 요구자 "승인할게 진행해"(10-05)
    types: [KCg-m, KCab-s, KCab-m, KCab-c, "KCa'b'-ap2", KCg-d, "KCa'b'-m", "KCa'b'-ap1", KCab-p, APL]
    pair_min_synapses: null
    groups:
      - {name: ALPN-KC, src: {class: [ALPN]}, dst: {class: [Kenyon_Cell]}}
      - {name: KC-APL, src: {class: [Kenyon_Cell]}, dst: {type: [APL]}}
      - {name: APL-KC, src: {type: [APL]}, dst: {class: [Kenyon_Cell]}}
      - {name: KC-KC, src: {class: [Kenyon_Cell]}, dst: {class: [Kenyon_Cell]}}
    measure: mb
    cmaes: {trials: 3, generations: 50}   # 연구 노트 16 §6 M1 — 양성 씨앗 3 · 50 세대(범위별 덮어쓰기)
  kc-mbon-a:                    # 2026-10-05 · 결과 전 — kc-sparse-c + KC → MBON 묶음 배율 하나(25) · 목표에 MBON 반응(physiology-v5)
    # 왜: c 로 KC 는 엽마다 켜지고 KC 입력이 MBON 90/97 에 닿았으나 MBON 발화 3/97 · KC 몫 중앙 0.62 mV 대 간격 7 mV
    #     (×14.6 · runs/mbon-probe-20261005-090304.json). 요구자 "(가) MBON 학습 진행해"(10-05).
    # MBON 종류마다 τ · 문턱을 두면 37 종 × 2 = 74 개 더 → CMA-ES(≤ 50 목표)에 너무 많아 묶음 배율 하나로.
    # ⚠️ 배율 상한은 bounds.alpha 10 그대로 — 필요 배수 중앙 14.6 이라 다 닿지 못할 수 있다(그러면 그렇게 기록).
    types: [KCg-m, KCab-s, KCab-m, KCab-c, "KCa'b'-ap2", KCg-d, "KCa'b'-m", "KCa'b'-ap1", KCab-p, APL]
    pair_min_synapses: null
    groups:
      - {name: ALPN-KC, src: {class: [ALPN]}, dst: {class: [Kenyon_Cell]}}
      - {name: KC-APL, src: {class: [Kenyon_Cell]}, dst: {type: [APL]}}
      - {name: APL-KC, src: {type: [APL]}, dst: {class: [Kenyon_Cell]}}
      - {name: KC-KC, src: {class: [Kenyon_Cell]}, dst: {class: [Kenyon_Cell]}}
      - {name: KC-MBON, src: {class: [Kenyon_Cell]}, dst: {class: [MBON]}}
    measure: mb
    cmaes: {trials: 3, generations: 50}
  kc-mbon-b:                    # 2026-10-06 · 결과 전 — kc-mbon-a 와 매개변수 같음(25) · 학습 냄새를 식초 + 무작위 3 묶음으로(physiology-v6)
    # 왜: a 는 식초 하나로 맞춰 보상 구획 MBON 이 식초에만 반응(다른 냄새 20 묶음 중 최대 15 % · runs/plasticity-cs-screen-20261006-070702.json)
    #     → 짝 안 지은 냄새 대조를 잴 수 없었고 탐색에서 CS− 도 −84 %. 요구자 "니가 가장 맞다고 생각하는쪽으로해"(10-06).
    types: [KCg-m, KCab-s, KCab-m, KCab-c, "KCa'b'-ap2", KCg-d, "KCa'b'-m", "KCa'b'-ap1", KCab-p, APL]
    pair_min_synapses: null
    groups:
      - {name: ALPN-KC, src: {class: [ALPN]}, dst: {class: [Kenyon_Cell]}}
      - {name: KC-APL, src: {class: [Kenyon_Cell]}, dst: {type: [APL]}}
      - {name: APL-KC, src: {type: [APL]}, dst: {class: [Kenyon_Cell]}}
      - {name: KC-KC, src: {class: [Kenyon_Cell]}, dst: {class: [Kenyon_Cell]}}
      - {name: KC-MBON, src: {class: [Kenyon_Cell]}, dst: {class: [MBON]}}
    measure: mb
    kc_probe:                    # 이 범위만 measure_kc 에 덧붙임
      extra_odors: {n: 3, size: 6, seed: 101}   # 식초 밖 ORN 6 종 × 3(씨앗 101~103) — 대조 후보(1~20) · 일반화(씨앗 1 · 10 종)와 다름
    cmaes: {trials: 3, generations: 50}
  # ⚠️ kc-sparse-a · b 는 제안(연구 노트 16) — M0(kc-probe) 결과로 하나를 고른 뒤 확정한다. ORN → PN 은 범위 밖
  space: null                   # 중심복합체 21 종(연구 노트 13 §2.1) — 종류 목록을 잠근 뒤
  escape: null                  # 시각 투사 346 + 하강 480 — 같음
cmaes:                          # 1 단계(I v2 §7.2) — 기울기 없음 · 정방향만 · 값은 선언(결과 전에 적음)
  sigma0: 0.3                   # 로그 매개변수 공간의 처음 걸음(e^0.3 ≈ 1.35 배)
  popsize: null                 # null = 4 + ⌊3 ln P⌋(P 44 → 15)
  generations: 100
  trials: 20                    # 평가 한 번의 다가옴 시행 수(bench fit-v1 과 같음)
  seed: 0
  reg_lambda: 0.01              # 규제 λ‖θ − θ₀‖²(로그 공간)
  nan_tolerances: 3.0           # 측정이 없을 때(GF 무반응 → 잠복 NaN) 벌점 = 이만큼 허용폭 밖
  null_seed: 1000               # 대조 항(rewired_gf_silent)용 재배선 씨앗 — 학습하는 그래프를 섞는다
  device: cpu
sgbptt:                         # 2 단계(I v2 §7.2) — 희소 대리 기울기 + 잘림 BPTT + 체크포인트 · 값은 선언
  surrogate_beta: 1.0           # 빠른 시그모이드 대리 도함수 1 / (1 + β|v − 문턱|)² (Zenke & Ganguli 2018 · 단위 1/mV)
  window_steps: 3000            # 잘림 길이(0.1 ms × 3,000 = 300 ms · 결정 하나)
  checkpoint_steps: 50          # 이 걸음마다 체크포인트(√3000 ≈ 55)
  dtype: float32                # 시험은 float64(엔진과 발화 완전 일치)
kc_probe:                       # M0(연구 노트 16 §6) — 학습 없이 지금 매개변수로 KC 희소성 · PN 발화율을 잰다(값은 선언 · 결과 전)
  stimuli:
    vinegar6: [ORN_DM1, ORN_DM4, ORN_DP1m, ORN_DM2, ORN_VA2, ORN_VM2]   # Semmelhack & Wang 2009 사과식초 3 ppm
    dm1va2: [ORN_DM1, ORN_VA2]  # 지금 과제의 먹이 냄새 — 음성 대조(≤ 2 %)
    none: []
  random_sets: 3                # 무작위 10 사구체 세트 수(ORN_* 종류에서 씨앗으로 뽑음)
  random_size: 10
  random_seed: 0
  orn_rate_hz: 150.0            # Shiu 기본 자극
  windows_ms: [100, 300, 500]   # 한 번 500 ms 를 돌리고 앞 구간을 잘라 센다
  seeds: [0, 1, 2]
  brains: [real, rewired-s0]
  pn_class: ALPN
  pn_input_min: 0.10            # 자극 ORN 에서 받은 시냅스 비율이 이 이상인 PN 을 "자극 PN" 으로(노트 16 §2.1)
  kc_min_type_size: 100         # KC 주요 종류(뉴런 ≥ 100 · 9 종 4,053)
  lobes:                        # 엽 묶음(physiology-v4 kc_lobe_* · 2026-10-05 결과 전) — 주요 9 종을 KC 이름의 엽으로
    gamma: [KCg-m, KCg-d]
    ab: [KCab-s, KCab-m, KCab-c, KCab-p]
    apbp: ["KCa'b'-ap1", "KCa'b'-ap2", "KCa'b'-m"]
  apl_type: APL
  mbon_class: MBON              # MBON 반응 측정(physiology-v5 · 2026-10-05 결과 전) — 주석 class 로 97 뉴런
  target_stimulus: vinegar6     # 회로 학습 평가(measure_kc)의 양성 자극 · 노트 16 §4
  negative_stimulus: dm1va2     # 음성 대조(≤ 2 % 목표)
  loss_window_ms: 300           # 결정 하나
  generalize:                   # M2(노트 16 §4 · §6) — 학습에 안 쓴 무작위 10 사구체 세트에서 KC 비율이 이 안인지
    sets: 5
    seed: 1                     # M0 · 학습의 무작위 세트(씨앗 0)와 다른 세트
    range: [0.03, 0.15]
    escape_trials: 20           # 도망 반사 재채점(bench fit-v1 과 같은 시행 수)

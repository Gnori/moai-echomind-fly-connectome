name: "dev"
display_name: "개발 프로세스 단축 명령"
description: "dev-req 스킬로 위임하는 단축 명령 디스패처 (R/I/P/W 산출물 체계)"
category: "productivity"
version: "2.2.0"
author: "MOAI Team"

# 스킬 타입
type: "dispatcher"

# 스크립트 정의 (디스패처만)
scripts:
  - name: "dispatch"
    file: "dispatch.py"
    description: "명령어 디스패처"
    parameters:
      - name: "command"
        type: "string"
        required: false
        description: "실행할 명령 (init, req, artifact, i|p|w, status, validate, archive, help)"

# 단축 명령어 매핑
shortcuts:
  # 요구사항 관리 (dev-req)
  init: "dev-req:init"
  req: "dev-req:create"
  artifact: "dev-req:artifact"
  i: "dev-req:artifact"
  p: "dev-req:artifact"
  w: "dev-req:artifact"
  status: "dev-req:progress-report"
  validate: "dev-req:validate"
  archive: "dev-req:archive"
  "docs init": "dev-gen-project-docs:init"
  "docs module": "dev-gen-project-docs:module"
  "docs status": "dev-gen-project-docs:status"

# 의존 스킬
dependencies:
  - "dev-req"
  - "dev-gen-project-docs"

# 사용 예시
examples:
  - command: "/dev init"
    description: "요구사항 관리 구조 초기화"

  - command: "/dev req 사용자인증기능 --id=1026"
    description: "새 요구사항(R) 생성"

  - command: "/dev artifact p --module=<모듈명>"
    description: "모듈 구현 플랜(P) 생성"

  - command: "/dev validate"
    description: "산출물 규약 검사"

  - command: "/dev archive --req=1026"
    description: "완료 세트 아카이브 이동"

  - command: "/dev status"
    description: "진행 상황 리포트"

  - command: "/dev help"
    description: "도움말 표시"

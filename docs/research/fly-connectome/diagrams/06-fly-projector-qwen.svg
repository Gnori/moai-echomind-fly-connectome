<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 390" role="img" aria-label="세 부품과 학습 여부: 초파리 뇌는 고정 배선이라 학습하지 않고, 그 신경 신호를 채널 벡터로 만들어 투영기가 Qwen 입력 자리의 소프트 토큰으로 바꾼다. 학습하는 것은 투영기뿐이다. Qwen 언어 모델은 얼려 두며 비전 인코더는 쓰지 않는다. 학습 때는 정답 글과의 차이가 Qwen 을 거꾸로 지나 투영기만 고친다">
<style>
  svg { font-family: "Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; color:#414A4F; }
  .bx { fill:#FAFBFB; stroke:#414A4F; stroke-width:1.2; }
  .bx-s { fill:#DCEFF1; stroke:#0E7C86; stroke-width:1.4; }
  .bx-b { fill:#F7E3EF; stroke:#AB2A79; stroke-width:1.4; }
  .bx-a { fill:#ECE6F8; stroke:#6B4FBB; stroke-width:2.2; }
  .bx-x { fill:#F4F4F4; stroke:#9AA3A8; stroke-width:1; stroke-dasharray:4 3; }
  .ln { stroke:#414A4F; stroke-width:1.2; fill:none; }
  .ln-d { stroke:#6B4FBB; stroke-width:1.4; fill:none; stroke-dasharray:5 4; }
  text { font-size:12px; fill:#12171A; }
  text.lbl { font-family:Menlo,ui-monospace,monospace; font-size:11px; fill:#6B757A; }
  text.t-s { fill:#0E7C86; font-weight:600; } text.t-b { fill:#AB2A79; font-weight:600; }
  text.t-a { fill:#6B4FBB; font-weight:700; } text.t-x { fill:#9AA3A8; }
</style>
<rect x="0" y="0" width="780" height="390" fill="#FFFFFF"/>
<defs>
  <marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><polygon points="0,1 9,5 0,9" fill="#414A4F"/></marker>
  <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><polygon points="0,1 9,5 0,9" fill="#6B4FBB"/></marker>
</defs>

<!-- 세계 → 초파리 -->
<rect class="bx" x="10" y="120" width="110" height="80" rx="3"/>
<text x="65" y="148" text-anchor="middle">세계 · 몸</text>
<text class="lbl" x="65" y="166" text-anchor="middle">FlyGym 1.x</text>
<text class="lbl" x="65" y="182" text-anchor="middle">냄새·물체·발</text>
<line class="ln" x1="120" y1="160" x2="148" y2="160" marker-end="url(#a0)"/>

<!-- 초파리 뇌 -->
<rect class="bx-s" x="150" y="100" width="150" height="120" rx="3"/>
<text class="t-s" x="225" y="126" text-anchor="middle">초파리 뇌 (앞 · 인코더)</text>
<text class="lbl" x="225" y="146" text-anchor="middle">커넥톰 LIF · 뉴런 16.5만</text>
<text class="lbl" x="225" y="162" text-anchor="middle">연결 2,556만</text>
<text x="225" y="192" text-anchor="middle">고정 배선</text>
<text x="225" y="208" text-anchor="middle">학습 없음</text>

<line class="ln" x1="300" y1="160" x2="338" y2="160" marker-end="url(#a0)"/>
<text class="lbl" x="318" y="78" text-anchor="middle">채널 벡터 9개</text>
<text class="lbl" x="318" y="92" text-anchor="middle">약 3.2만 차원</text>

<!-- 투영기 -->
<rect class="bx-a" x="340" y="100" width="140" height="120" rx="3"/>
<text class="t-a" x="410" y="126" text-anchor="middle">투영기 (다리)</text>
<text class="lbl" x="410" y="146" text-anchor="middle">새로 만든 작은 망</text>
<text class="lbl" x="410" y="162" text-anchor="middle">매개변수 3,200만</text>
<text class="t-a" x="410" y="192" text-anchor="middle">이것만 학습</text>
<text class="lbl" x="410" y="208" text-anchor="middle">Qwen 의 0.1 %</text>

<line class="ln" x1="480" y1="160" x2="528" y2="160" marker-end="url(#a0)"/>
<text class="lbl" x="506" y="78" text-anchor="middle">소프트 토큰 18개</text>
<text class="lbl" x="506" y="92" text-anchor="middle">&lt;|vision_pad|&gt; 자리</text>

<!-- Qwen -->
<rect class="bx-b" x="530" y="100" width="150" height="120" rx="3"/>
<text class="t-b" x="605" y="126" text-anchor="middle">Qwen3.8-27B (뒤 · 생성기)</text>
<text class="lbl" x="605" y="146" text-anchor="middle">언어 모델 부분만</text>
<text class="lbl" x="605" y="162" text-anchor="middle">매개변수 270억</text>
<text x="605" y="192" text-anchor="middle">얼림</text>
<text x="605" y="208" text-anchor="middle">학습 없음</text>

<!-- 글 입력 -->
<rect class="bx" x="530" y="18" width="150" height="46" rx="3"/>
<text x="605" y="38" text-anchor="middle">글(지시 · 질문)</text>
<text class="lbl" x="605" y="54" text-anchor="middle">"지금 무엇이 느껴지나?"</text>
<line class="ln" x1="605" y1="64" x2="605" y2="98" marker-end="url(#a0)"/>

<!-- 출력 -->
<line class="ln" x1="680" y1="150" x2="700" y2="150"/>
<line class="ln" x1="700" y1="130" x2="700" y2="190"/>
<line class="ln" x1="700" y1="130" x2="712" y2="130" marker-end="url(#a0)"/>
<line class="ln" x1="700" y1="190" x2="712" y2="190" marker-end="url(#a0)"/>
<text x="716" y="126">글 대답</text>
<text class="lbl" x="716" y="141">(캡션)</text>
<text x="716" y="186">행동</text>
<text class="lbl" x="716" y="201">JSON</text>

<!-- 비전 인코더: 안 씀 -->
<rect class="bx-x" x="340" y="18" width="140" height="46" rx="3"/>
<text class="t-x" x="410" y="38" text-anchor="middle">Qwen 비전 인코더</text>
<text class="t-x" x="410" y="54" text-anchor="middle">쓰지 않음 · 자리만 빌림</text>

<!-- 학습 때 되돌아가는 차이 -->
<path class="ln-d" d="M 740 214 L 740 262 L 410 262 L 410 224" marker-end="url(#a1)"/>
<text class="t-a" x="575" y="290" text-anchor="middle">학습 때만: 정답 글과 틀린 만큼(기울기)이</text>
<text class="t-a" x="575" y="308" text-anchor="middle">Qwen 을 거꾸로 지나 투영기만 고친다</text>
<text class="lbl" x="575" y="334" text-anchor="middle">정답 = 세계의 참값에서 코드가 만든 글(캡션 · 교사 행동)</text>
<text class="lbl" x="575" y="352" text-anchor="middle">Qwen 은 지나가기만 하고 바뀌지 않는다</text>
<text class="lbl" x="575" y="370" text-anchor="middle">→ 학습 전후 가중치 지문이 같아야 한다</text>
<text class="lbl" x="225" y="250" text-anchor="middle">대조군: 같은 뉴런 · 같은 연결 수</text>
<text class="lbl" x="225" y="266" text-anchor="middle">전선만 무작위로 섞은 뇌로도</text>
<text class="lbl" x="225" y="282" text-anchor="middle">투영기를 똑같이 학습한다</text>
</svg>
